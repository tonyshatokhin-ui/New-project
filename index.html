<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bronze Crown Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="src/config/constants.js"></script>
    <script src="src/audio/audio.js"></script>
    <script src="src/i18n/translations.js"></script>
    <script src="src/i18n/menu-translations.js"></script>
    <script src="src/i18n/i18n.js"></script>
    <script src="src/data/city-data.js"></script>
    <script src="src/data/progression-data.js"></script>
    <script src="src/data/world-data.js"></script>

    <script src="src/ui/app-view.js"></script>
    <script src="src/ui/shell.js"></script>
    <script src="src/ui/world-view.js"></script>
    <script type="module">
      (async () => {
        const candidates = [
          "./node_modules/three/build/three.module.js",
          "../node_modules/three/build/three.module.js",
          "https://unpkg.com/three@0.164.1/build/three.module.js",
          "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        ];
        for (const url of candidates) {
          try {
            const mod = await import(url);
            if (mod) {
              window.THREE = mod;
              window.dispatchEvent(new Event("three-ready"));
              return;
            }
          } catch (_) {
            // try next source
          }
        }
      })();
    </script>
    <script src="src/ui/city-3d-assets.js"></script>
    <script src="src/ui/city-scene-3d.js"></script>
    <script src="src/ui/city-view.js"></script>
    <script src="src/ui/hex-inspector.js"></script>
    <script src="src/ui/drawers.js"></script>
    <script src="src/ui/components.js"></script>
    <script src="src/ui/menu-view.js"></script>
    <script src="src/selectors.js"></script>
    <script src="src/actions/city-actions.js"></script>
    <script src="src/actions/diplomacy-actions.js"></script>

    <script src="src/world/generation.js"></script>
    <script src="src/world/glyphs.js"></script>
    <script src="src/world/map-queries.js"></script>
    <script src="src/systems/army-stubs.js"></script>
    <script src="src/input/keyboard.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
